<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piscines Dupont — Voyez votre piscine dans votre jardin</title>
<!-- Page hôte de démonstration, habillée comme le site de Maxime (plan §13) : jetons de marque sur :root,
     polices chargées par la page (pas par le composant). ?palette=lagon|riviera|mineral|terre change la marque (demo.js). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Onest:wght@400;500;600&display=swap">
<style>
  :root {
    --water: #19B5C8; --deep: #062A30; --sand: #EFF5F2; --accent: #FFD23F;
    --ink: #08262B; --on-accent: #1B1600; --on-deep: #F2FBFA;
    --fd: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif; --fb: "Onest", "Helvetica Neue", system-ui, sans-serif;
    --line-d: color-mix(in oklab, var(--on-deep) 18%, transparent);
    --r: 22px; --ease: cubic-bezier(.2,.8,.2,1);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { margin: 0; background: var(--deep); color: var(--on-deep); font: 400 1.0625rem/1.6 var(--fb); -webkit-font-smoothing: antialiased; }
  h1, h2, p { margin: 0; }
  h1, h2 { font-family: var(--fd); font-weight: 700; letter-spacing: -.02em; line-height: 1.02; text-wrap: balance; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  [hidden] { display: none !important; }
  .barre { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px clamp(20px, 5vw, 72px); background: var(--sand); color: var(--ink); }
  .barre b { font: 700 1.05rem/1 var(--fd); letter-spacing: -.01em; }
  .barre a { font-weight: 500; color: inherit; text-underline-offset: 5px; text-decoration-thickness: 1.5px; }
  main { width: min(1120px, 100%); margin: 0 auto; padding: clamp(28px, 6vw, 72px) clamp(20px, 5vw, 72px) 64px; display: grid; gap: 28px; }
  .tete p { margin-top: 14px; color: color-mix(in oklab, var(--on-deep) 78%, transparent); max-width: 34ch; }
  h1 { font-size: clamp(2.1rem, 5vw, 4.2rem); }
  piscine-ar { display: block; width: 100%; max-width: 440px; aspect-ratio: 9 / 16; max-height: 86vh; border-radius: var(--r); overflow: hidden;
    box-shadow: 0 0 0 1px var(--line-d), 0 40px 80px -40px #000; }
  .colonne { display: grid; gap: 20px; align-content: start; }
  section { padding: 20px; border-radius: var(--r); background: color-mix(in oklab, var(--on-deep) 7%, transparent); box-shadow: inset 0 0 0 1.5px var(--line-d); }
  section h2 { font-size: 1.5rem; margin-bottom: 12px; }
  #photo-vue { display: block; width: 100%; border-radius: 16px; margin: 0 0 14px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 54px; padding: 0 28px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: 600 1.02rem/1 var(--fb); cursor: pointer; }
  #devis-message { margin-top: 12px; }
  #qr { text-align: center; }
  #qr canvas { background: #fff; padding: 8px; border-radius: 14px; max-width: 100%; }
  #qr p { margin-top: 10px; color: color-mix(in oklab, var(--on-deep) 78%, transparent); }
  @media (min-width: 900px) {
    main { grid-template-columns: minmax(0, 1fr) 440px; align-items: start; }
    .tete { grid-column: 1 / -1; }
    piscine-ar { grid-column: 2; grid-row: 2 / span 2; }
  }
  @media (max-width: 600px) {
    main { padding: 28px 0 40px; }
    .tete, .colonne { padding: 0 20px; }
    /* Sur téléphone, le composant prend l'écran entier, comme dans un site de pisciniste. */
    piscine-ar { max-width: none; max-height: none; aspect-ratio: auto; height: 100vh; height: 100svh; border-radius: 0; box-shadow: none; }
    #qr { display: none; }
  }
</style>
</head>
<body>
<header class="barre"><b>Piscines Dupont</b><a href="./integree.html">Version intégrée</a></header>
<main>
  <div class="tete">
    <h1>Voyez votre piscine dans votre jardin.</h1>
    <p>Choisissez un modèle et posez-le chez vous, à sa vraie taille.</p>
  </div>

  <piscine-ar config="config/pisciniste-demo.json"></piscine-ar>

  <div class="colonne">
    <section id="devis" hidden>
      <h2>Votre photo</h2>
      <img id="photo-vue" alt="Votre jardin avec la piscine">
      <button id="devis-bouton" class="btn" type="button">Recevoir un devis avec cette photo</button>
      <p id="devis-message" role="status" hidden>Ici, le site du pisciniste reçoit la photo.</p>
    </section>

    <section id="qr">
      <h2>Sur ordinateur ? Passez sur votre téléphone</h2>
      <canvas id="qr-canvas" width="200" height="200" role="img" aria-label="QR code de cette page"></canvas>
      <p>Flashez ce code avec l'appareil photo de votre téléphone.</p>
    </section>
  </div>
</main>
<script type="module" src="./demo.js"></script>
</body>
</html>
