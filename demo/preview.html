<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aperçu des piscines</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e8eef2; font: 16px/1.4 system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  #barre { position: fixed; left: 16px; right: 16px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    justify-content: center; padding: 12px 16px; border-radius: 14px; background: rgba(15, 20, 25, 0.78); color: #fff; }
  #barre label { display: flex; align-items: center; gap: 8px; }
  select, button { font: inherit; color: #fff; background: rgba(255, 255, 255, 0.14); border: 2px solid transparent; border-radius: 10px; padding: 8px 14px; cursor: pointer; }
  select option { color: #000; }
  button[aria-pressed="true"] { border-color: #fff; background: rgba(255, 255, 255, 0.28); }
  button i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 8px; vertical-align: -2px; border: 1px solid #fff; }
  #titre { position: fixed; top: 16px; left: 16px; padding: 8px 14px; border-radius: 10px; background: rgba(15, 20, 25, 0.78); color: #fff; }
  body.shot #barre, body.shot #titre { display: none; }
</style>
</head>
<body>
<div id="titre">Aperçu des piscines</div>
<div id="barre">
  <label>Modèle <select id="modele"></select></label>
  <span id="eaux" role="group" aria-label="Couleur de l'eau"></span>
</div>
<script type="module" src="./preview.js"></script>
</body>
</html>
