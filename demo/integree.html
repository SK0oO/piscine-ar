<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piscines Dupont — Dessinez-la (démo intégrée)</title>
<!-- Démo « intégrée » (plan §13.2) : le composant dans la boîte 4:3 de la section #dessiner de la maquette de Maxime,
     sous trois onglets factices. La forme choisie est posée sur l'attribut `modele`, comme le fera le configurateur.
     ?palette=lagon|riviera|mineral|terre change la marque (demo.js). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Onest:wght@400;500;600&display=swap">
<style>
  :root {
    --water: #19B5C8; --deep: #062A30; --sand: #EFF5F2; --accent: #FFD23F;
    --ink: #08262B; --on-accent: #1B1600; --on-deep: #F2FBFA;
    --fd: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif; --fb: "Onest", "Helvetica Neue", system-ui, sans-serif;
    --line-d: color-mix(in oklab, var(--on-deep) 18%, transparent);
    --deep-2: color-mix(in oklab, var(--deep) 88%, var(--water));
    --pad: clamp(20px, 5vw, 72px); --r: 22px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { margin: 0; background: var(--deep); color: var(--on-deep); font: 400 1.0625rem/1.6 var(--fb); -webkit-font-smoothing: antialiased; }
  h2, p, fieldset { margin: 0; padding: 0; }
  fieldset { border: 0; min-width: 0; }
  h2 { font: 700 clamp(2.1rem, 5vw, 4.2rem)/1.02 var(--fd); letter-spacing: -.02em; text-wrap: balance; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .barre { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px var(--pad); background: var(--sand); color: var(--ink); }
  .barre b { font: 700 1.05rem/1 var(--fd); letter-spacing: -.01em; }
  .barre a { font-weight: 500; color: inherit; text-underline-offset: 5px; text-decoration-thickness: 1.5px; }
  .wrap { width: min(1120px, 100%); margin: 0 auto; padding: clamp(40px, 7vw, 96px) var(--pad) 64px; display: grid; gap: 28px; }
  .wrap > header p { margin-top: 14px; color: color-mix(in oklab, var(--on-deep) 72%, transparent); max-width: 40ch; }
  /* La boîte de Maxime (.stage, .photo, .ar) */
  .stage { position: relative; border-radius: var(--r); overflow: hidden; background: var(--deep-2); box-shadow: 0 0 0 1px var(--line-d), 0 40px 80px -40px #000; max-width: 640px; }
  .stage__tabs { position: absolute; left: 12px; top: 12px; right: 12px; z-index: 5; display: flex; gap: 6px; flex-wrap: wrap; }
  .stage__tabs button { display: inline-flex; align-items: center; min-height: 40px; padding: 0 15px; border-radius: 99px; border: 0; background: color-mix(in oklab, var(--deep) 72%, transparent); color: #fff; font: 500 .88rem/1 var(--fb); cursor: pointer; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .stage__tabs button[aria-selected="true"] { background: #fff; color: var(--deep); }
  .photo { position: relative; aspect-ratio: 4 / 3; overflow: hidden; }
  .ar { position: absolute; inset: 0; z-index: 4; background: var(--deep-2); }
  .ar > * { display: block; width: 100%; height: 100%; }
  /* Le choix de forme du configurateur (.seg de Maxime) */
  .ctl legend { font-weight: 600; font-size: .98rem; margin-bottom: 11px; }
  .seg { display: flex; padding: 4px; border-radius: 99px; background: color-mix(in oklab, var(--on-deep) 8%, transparent); box-shadow: inset 0 0 0 1.5px var(--line-d); max-width: 640px; }
  .seg label { flex: 1; position: relative; text-align: center; cursor: pointer; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: grid; place-items: center; min-height: 44px; padding: 0 8px; border-radius: 99px; font-size: .92rem; font-weight: 500; }
  .seg :checked + span { background: var(--on-deep); color: var(--deep); }
  .seg label:has(:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 99px; }
</style>
</head>
<body>
<header class="barre"><b>Piscines Dupont</b><a href="./">Version plein écran</a></header>
<section class="wrap" id="dessiner">
  <header>
    <h2>Dessinez&#8209;la. Le prix suit.</h2>
    <p>Réglez la forme, puis voyez-la chez vous, dans votre jardin.</p>
  </header>
  <div class="stage">
    <div class="stage__tabs" role="tablist" aria-label="Vue">
      <button type="button" role="tab" aria-selected="false">Vue du dessus</button>
      <button type="button" role="tab" aria-selected="true">Dans mon jardin</button>
      <button type="button" role="tab" aria-selected="false">Ma photo</button>
    </div>
    <div class="photo">
      <div class="ar"><piscine-ar config="config/pisciniste-demo.json" modele="rectangle"></piscine-ar></div>
    </div>
  </div>
  <form class="ctl" id="ctl">
    <fieldset>
      <legend>Forme</legend>
      <div class="seg">
        <label><input type="radio" name="forme" value="rectangle" checked><span>Rectangle</span></label>
        <label><input type="radio" name="forme" value="haricot"><span>Forme libre</span></label>
        <label><input type="radio" name="forme" value="ovale"><span>Ovale</span></label>
      </div>
    </fieldset>
  </form>
</section>
<script>
  // Comme le configurateur de Maxime (app.js, AR.attrs) : la forme choisie devient l'attribut `modele`.
  document.getElementById('ctl').addEventListener('change', (e) => {
    if (e.target.name === 'forme') document.querySelector('piscine-ar').setAttribute('modele', e.target.value);
  });
</script>
<script type="module" src="./demo.js"></script>
</body>
</html>
